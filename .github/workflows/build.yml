name: Build Windows Executable

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create a GitHub Release with this build?"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  # ── Job 1: tests on Linux (fast, no GUI needed) ──────────────────────────
  test-linux:
    name: Tests (Linux / Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (no GUI)
        run: |
          python -m pip install --upgrade pip
          pip install pyserial numpy pandas matplotlib pytest

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # ── Job 2: Windows build ─────────────────────────────────────────────────
  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest
    needs: test-linux

    # Required so softprops/action-gh-release can create a Release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run tests (Windows)
        run: python -m pytest tests/ -v --tb=short

      - name: Build with PyInstaller
        run: pyinstaller piko_analyzer.spec --clean --noconfirm

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "dist\PIKO_Analyzer\PIKO_Analyzer.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Executable not found: $exe"
            exit 1
          }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "OK — PIKO_Analyzer.exe is $mb MB"

      - name: Create ZIP archive
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          if ($ref -notmatch '^v') { $ref = "dev" }
          $zip = "PIKO_Analyzer_Windows_${ref}.zip"
          Compress-Archive -Path "dist\PIKO_Analyzer\*" -DestinationPath $zip
          Write-Host "Created $zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PIKO_Analyzer_Windows
          path: PIKO_Analyzer_Windows_*.zip
          retention-days: 30

      - name: Create GitHub Release
        if: >
          startsWith(github.ref, 'refs/tags/v') ||
          github.event.inputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "PIKO Analyzer ${{ github.ref_name }}"
          generate_release_notes: true
          files: PIKO_Analyzer_Windows_*.zip
