name: Build Windows Executable

on:
  push:
    tags:
      - "v*"          # trigger on version tags: v1.0, v1.2.3, etc.
  workflow_dispatch:  # allow manual trigger from GitHub UI

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Build with PyInstaller
        run: |
          pyinstaller piko_analyzer.spec --clean --noconfirm

      - name: Verify executable exists
        run: |
          if (!(Test-Path "dist\PIKO_Analyzer\PIKO_Analyzer.exe")) {
            Write-Error "Executable not found"
            exit 1
          }
          Write-Host "Executable size: $((Get-Item 'dist\PIKO_Analyzer\PIKO_Analyzer.exe').Length / 1MB) MB"

      - name: Create ZIP archive
        run: |
          Compress-Archive -Path "dist\PIKO_Analyzer\*" -DestinationPath "PIKO_Analyzer_Windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PIKO_Analyzer_Windows
          path: PIKO_Analyzer_Windows.zip
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PIKO_Analyzer_Windows.zip
          generate_release_notes: true
